name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 1. 协议层硬铁律门禁（32 项静态评测与行为契约，含数字一致性守门）
  protocol-gate:
    name: Protocol Evals Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
          cache-dependency-path: puax-mcp-server/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install MCP Server dependencies & build
        working-directory: ./puax-mcp-server
        run: |
          npm ci
          npm run build

      - name: Run 32 Protocol Evals Gates
        run: node evals/run-all.js

  # 2. MCP Server 跨平台与跨 Node 版本测试矩阵
  mcp-server:
    name: MCP Server (${{ matrix.os }} - Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [18.x, 20.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: puax-mcp-server/package-lock.json

      - name: Install dependencies
        working-directory: ./puax-mcp-server
        run: npm ci

      - name: Code Style & Lint check
        working-directory: ./puax-mcp-server
        run: npm run lint

      - name: TypeScript Typecheck
        working-directory: ./puax-mcp-server
        run: npm run typecheck

      - name: Build MCP Server
        working-directory: ./puax-mcp-server
        run: npm run build

      - name: Run Full Test Suite
        working-directory: ./puax-mcp-server
        env:
          NODE_OPTIONS: --experimental-vm-modules
        # 钉 bash：Windows 腿默认 pwsh 的引号规则会弄哑注解脚本
        shell: bash
        # --json 落盘后把失败用例以 ::error:: 注解上报（公共注解 API 可读，
        # 免管理员权限即可定位平台特异失败），最终以 jest 结论定退出码
        run: |
          npx jest --coverage --json --outputFile="$RUNNER_TEMP/jest-result.json" || true
          node -e "
            const path = require('path');
            const r = require(path.join(process.env.RUNNER_TEMP, 'jest-result.json'));
            for (const s of r.testResults) {
              if (s.status !== 'failed') continue;
              console.log('::error::FAIL SUITE ' + s.name.replace(process.cwd() + path.sep, '').replace(/\\\\/g, '/'));
              for (const a of (s.assertionResults || []).filter(x => x.status === 'failed')) {
                const head = (a.failureMessages && a.failureMessages[0] || '').split('\n').slice(0, 4).join(' | ');
                console.log('::error::FAIL ' + a.fullName + ' :: ' + head);
              }
            }
            process.exit(r.success ? 0 : 1);
          "

      - name: Upload Coverage Artifacts
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == '20.x'
        uses: actions/upload-artifact@v4
        with:
          name: mcp-coverage-report
          path: ./puax-mcp-server/coverage/

  # 3. 前端构建不阻塞主线（策令：Web Admin / Landing 冻结，禁止为人类店面挡 MCP 发版）
  frontend-apps:
    name: Frontend Apps (non-blocking, frozen)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Build Landing (Vite + React 19)
        working-directory: ./landing
        run: |
          npm ci
          npm run build

      - name: Build Web Admin (Vite + React 19)
        working-directory: ./web-admin
        run: |
          npm ci
          npm run build

  # 4. 全量质量总闸门：仅协议门 + MCP 矩阵
  ci-success:
    name: CI Quality Gate Success
    needs: [protocol-gate, mcp-server]
    runs-on: ubuntu-latest
    steps:
      - name: Confirm All Gates Passed
        run: echo "🎉 All PUAX CI/CD Quality Gates & Anti-Cheat Invariants Passed!"
