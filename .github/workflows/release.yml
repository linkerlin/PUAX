name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Release & Publish PUAX
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
          cache-dependency-path: puax-mcp-server/package-lock.json

      - name: Install dependencies
        working-directory: ./puax-mcp-server
        run: npm ci

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build MCP Server
        working-directory: ./puax-mcp-server
        run: npm run build

      - name: Run 27 Protocol Gates
        run: node evals/run-all.js

      - name: Run Full Test Suite
        working-directory: ./puax-mcp-server
        run: npm test

      - name: Build Frontend Artifacts
        run: |
          cd landing && npm ci && npm run build && cd ..
          cd web-admin && npm ci && npm run build && cd ..

      - name: Publish to NPM
        working-directory: ./puax-mcp-server
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
