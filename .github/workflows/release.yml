name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Release & Publish PUAX
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
          cache-dependency-path: puax-mcp-server/package-lock.json

      - name: Install dependencies
        working-directory: ./puax-mcp-server
        run: npm ci

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build MCP Server
        working-directory: ./puax-mcp-server
        run: npm run build

      - name: Run 32 Protocol Gates
        run: node evals/run-all.js

      - name: Run Full Test Suite
        working-directory: ./puax-mcp-server
        run: npm test

      - name: Publish to NPM
        working-directory: ./puax-mcp-server
        # 失败时把日志尾行以 ::error:: 注解上报（公共注解 API 可读，免管理员定位）；
        # npm ≤10 报 "npm ERR!"、npm ≥11 报小写 "npm error!"，两种格式都匹配
        shell: bash
        run: |
          # 默认 bash -eo pipefail 会在 npm publish 失败行直接终止脚本，吞掉注解捕获；先解除
          set +e
          npm publish --access public 2>&1 | tee "$RUNNER_TEMP/npm-publish.log"; code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            grep -iE 'npm (err|error)' "$RUNNER_TEMP/npm-publish.log" | head -8 | while IFS= read -r l; do echo "::error::$l"; done
            tail -12 "$RUNNER_TEMP/npm-publish.log" | while IFS= read -r l; do echo "::error::[tail] $l"; done
          fi
          exit $code
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Build Python SDK (puax-amp)
        run: |
          pip install build
          python -m build distributions/python

      - name: Publish puax-amp to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # python -m build 产物落在 distributions/python/dist/，不在此指明则 action 默认找仓库根 dist/（必空）
          packages-dir: distributions/python/dist


      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
