name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Release & Publish PUAX
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
          cache-dependency-path: puax-mcp-server/package-lock.json

      - name: Install dependencies
        working-directory: ./puax-mcp-server
        run: npm ci

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build MCP Server
        working-directory: ./puax-mcp-server
        run: npm run build

      - name: Run 32 Protocol Gates
        run: node evals/run-all.js

      - name: Run Full Test Suite
        working-directory: ./puax-mcp-server
        run: npm test

      - name: Publish to NPM
        working-directory: ./puax-mcp-server
        # 无 NPM_TOKEN 时跳过，不挡后续 GitHub Release
        shell: bash
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "::warning::NPM_TOKEN 未配置，跳过 npm publish"
            exit 0
          fi
          set +e
          npm publish --access public 2>&1 | tee "$RUNNER_TEMP/npm-publish.log"; code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            grep -iE 'npm (err|error)' "$RUNNER_TEMP/npm-publish.log" | head -8 | while IFS= read -r l; do echo "::error::$l"; done
            tail -12 "$RUNNER_TEMP/npm-publish.log" | while IFS= read -r l; do echo "::error::[tail] $l"; done
          fi
          exit $code
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Build Python SDK (puax-amp)
        run: |
          pip install build
          python -m build distributions/python

      - name: Publish puax-amp to PyPI
        continue-on-error: true
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: distributions/python/dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
